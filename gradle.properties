# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

org.gradle.configuration-cache=false

# Java
java_version=17

# Minecraft
minecraft_version=1.20.1
compatible_minecraft_versions_fabric=1.20.1
compatible_minecraft_versions_forge=[1.20.1,1.20.2)

# Fabric
loader_version=0.19.2
fabric_api_version=0.92.9+1.20.1
loom_version=1.11.7

# Forge
forge_version=1.20.1-47.4.20
forge_gradle_version=6.0.54
mixingradle_version=0.7.38
forge_loader_version_range=[47,)

# Mod
mod_id=quietly
mod_name=Quietly
mod_version=1.0.0
mod_version_minecraft_suffix=1.20.1
maven_group=cn.kafei
mod_author=Kafei
mod_license=CC0-1.0
mod_description=Server-side silent opening for chests, trapped chests, barrels and ender chests with a bossbar progress bar. Sneak and right-click once to start, then keep sneaking until it opens. Server required, client optional.

systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
